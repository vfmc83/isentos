name: Daily data update

on:
  schedule:
    # Repo publico = GitHub Actions ILIMITADO (sem custo de minutos).
    # Rodamos de hora em hora durante o pregao da B3 para a cota de
    # mercado nunca ficar mais de ~1h atrasada. Horarios em UTC.
    # Pregao B3 ~10h-18h BRT = 13h-21h UTC. Cobrimos 12h-22h UTC
    # (09h-19h BRT), uma folga antes/depois. Minuto 7 evita o pico
    # do topo da hora (onde o agendador do GitHub costuma atrasar).
    - cron: '7 12-22 * * 1-5'
  # Permite rodar manualmente pela aba Actions do GitHub
  workflow_dispatch:
  # Permite disparo externo confiavel (ex.: cron-job.org) via API repository_dispatch
  repository_dispatch:
    types: [run-daily]
  # Roda automaticamente tambem quando voce faz push (util para o primeiro deploy)
  push:
    branches: [ main ]
    paths:
      - 'scripts/build_data.py'
      - '.github/workflows/daily.yml'

# Evita que duas execucoes agendadas colidam no push (uma espera a outra).
concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pdfplumber

      - name: Run build_data.py
        run: python scripts/build_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "engage-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet data.json data.js; then
            echo "Sem mudanças em data.json"
          else
            git add data.json data.js
            git commit -m "chore: data.json atualizado em $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push falhou (tentativa $i), tentando de novo..."
              sleep 3
            done
          fi
