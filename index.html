  ISET11: { primary: '#185FA5', soft: '#E6F1FB', dark: '#0C447C' },
  ISEN11: { primary: '#0F6E56', soft: '#E1F5EE', dark: '#085041' },

};

function parseDate(iso) { return new Date(iso + 'T12:00:00'); }
function fmtDateBR(iso) {
  const d = parseDate(iso);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function fmtMonthBR(iso) {
  const d = parseDate(iso);
  return d.toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' });
}
function fmtMoney(v) {
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtMoneyCompact(v) {
  if (v >= 1e9) return 'R$ ' + (v/1e9).toFixed(2) + ' bi';
  if (v >= 1e6) return 'R$ ' + (v/1e6).toFixed(2) + ' mi';
  if (v >= 1e3) return 'R$ ' + (v/1e3).toFixed(0) + ' mil';
  return 'R$ ' + v.toFixed(0);
}
function fmtPct(v, decs=2) { return v.toFixed(decs).replace('.', ',') + '%'; }

function isDU(iso, feriadosSet) {
  const d = parseDate(iso);
  const wd = d.getDay();
  if (wd === 0 || wd === 6) return false;
  return !feriadosSet.has(iso);
}
function listarDU(dataIniIso, dataFimIso, feriadosSet) {
  const out = [];
  const fim = parseDate(dataFimIso);
  let cur = parseDate(dataIniIso);
  while (cur <= fim) {
    const iso = cur.toISOString().split('T')[0];
    if (isDU(iso, feriadosSet)) out.push(iso);
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}
function contarDU(dataIniIso, dataFimIso, feriadosSet) {
  let n = 0;
  const ini = parseDate(dataIniIso);
  const fim = parseDate(dataFimIso);
  let cur = new Date(ini);
  cur.setDate(cur.getDate() + 1);
  while (cur <= fim) {
    const iso = cur.toISOString().split('T')[0];
    if (isDU(iso, feriadosSet)) n++;
    cur.setDate(cur.getDate() + 1);
  }
  return n;
}

function calcVolMed30(historico) {
  const ult30 = historico.slice(-30);
  if (ult30.length === 0) return { volume: 0, qtd: 0, neg: 0, pregoes: 0 };
  const vol = ult30.reduce((a, x) => a + x.v, 0) / ult30.length;
  const qtd = ult30.reduce((a, x) => a + x.q, 0) / ult30.length;
  const neg = ult30.reduce((a, x) => a + x.n, 0) / ult30.length;
  return { volume: vol, qtd: qtd, neg: neg, pregoes: ult30.length };
}

function reconstruirCotaPatrimonial({ cotaInicial, dtLiqPrimaria, dtRef, yldPctCdi, cdiSerie, feriadosSet , historicoPatrim}) {
  if (Array.isArray(historicoPatrim) && historicoPatrim.length) return historicoPatrim;
  const dus = listarDU(dtLiqPrimaria, dtRef, feriadosSet);
  let cota = cotaInicial;
  const out = [{ d: dtLiqPrimaria, cota: cotaInicial }];
  for (let i = 1; i < dus.length; i++) {
    const iso = dus[i];
    const cdiDia = cdiSerie[iso] !== undefined ? cdiSerie[iso] : null;
    if (cdiDia !== null) {
      cota = cota * (1 + (yldPctCdi/100) * cdiDia);
    }
    out.push({ d: iso, cota: cota });
  }
  return out;
}
function projetarCotaFutura({ cotaAtual, dtRef, dtFinal, yldPctCdi, cdiAaProj, feriadosSet }) {
  const dus = listarDU(dtRef, dtFinal, feriadosSet);
  const cdiDia = Math.pow(1 + cdiAaProj/100, 1/252) - 1;
  let cota = cotaAtual;
  const out = [];
  for (let i = 1; i < dus.length; i++) {
    cota = cota * (1 + (yldPctCdi/100) * cdiDia);
    out.push({ d: dus[i], cota: cota });
  }
  return out;
}

function calcularCurvaCDI({ cotaInicial, dtCompra, yldAlvoPctCdi, cdiSerie, cdiAaProj, dtAteHoje, dtFinal, feriadosSet }) {
  const cdiDiaProj = Math.pow(1 + cdiAaProj/100, 1/252) - 1;
  const dus = listarDU(dtCompra, dtFinal, feriadosSet);
  let val = cotaInicial;
  const out = [{ d: dtCompra, valor: cotaInicial }];
  for (let i = 1; i < dus.length; i++) {
    const iso = dus[i];
    let cdiDia;
    if (iso <= dtAteHoje && cdiSerie[iso] !== undefined) {
      cdiDia = cdiSerie[iso];
    } else {
      cdiDia = cdiDiaProj;
    }
    val = val * (1 + (yldAlvoPctCdi/100) * cdiDia);
    out.push({ d: iso, valor: val });
  }
  return out;
}

const ITAU_PDF_URLS = {
  ISET11: 'https://assetfront.arquivosparceiros.cloud.itau.com.br/FND/Sensibilidade-ISET.pdf',
  ISEN11: 'https://assetfront.arquivosparceiros.cloud.itau.com.br/FND/Sensibilidade-ISEN.pdf',

  ISNT11: 'https://assetfront.arquivosparceiros.cloud.itau.com.br/FND/Sensibilidade-ISNT.pdf',
};

const CORS_PROXIES = [
  (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  (url) => url,
];

async function fetchPdfArrayBuffer(targetUrl) {
  let lastErr = null;
  for (const proxyFn of CORS_PROXIES) {
    try {
      const r = await fetch(proxyFn(targetUrl));
      if (!r.ok) { lastErr = new Error('HTTP ' + r.status); continue; }
      const buf = await r.arrayBuffer();
      if (buf.byteLength < 1000) { lastErr = new Error('Resposta muito pequena'); continue; }
      const head = new Uint8Array(buf, 0, 5);
      const hex = String.fromCharCode(...head);
      if (!hex.startsWith('%PDF')) { lastErr = new Error('Não é PDF'); continue; }
      return buf;
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('Todos os proxies falharam');
}

async function pdfArrayBufferToText(buf) {
  if (typeof window === 'undefined' || !window.pdfjsLib) {
    throw new Error('pdf.js não carregado');
  }
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  let texto = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const linha = content.items.map(it => it.str).join(' ');
    texto += linha + '\n';
  }
  return texto;
}

function parseSensibilidadeItau(texto) {
  const out = { dataRef: null, cotaPatrim: null, pl: null, duration: null, yieldPctCdi: null, qtdCotas: null, caixaPct: null };
  
  const mData = texto.match(/Data de refer[êe]ncia:\s*(\d{2})\/(\d{2})\/(\d{4})/i);
  if (mData) out.dataRef = `${mData[3]}-${mData[2]}-${mData[1]}`;
  
  const mCota = texto.match(/Valor Cota Patrimonial\s*([\d.,]+)/i);
  if (mCota) out.cotaPatrim = parseFloat(mCota[1].replace(/\./g, '').replace(',', '.'));
  
  const mPL = texto.match(/Patrim[ôo]nio L[íi]quido\s*R\$\s*([\d.,]+)/i);
  if (mPL) out.pl = parseFloat(mPL[1].replace(/\./g, '').replace(',', '.'));
  
  const mDur = texto.match(/Duration da carteira\s*([\d.,]+)/i);
  if (mDur) out.duration = parseFloat(mDur[1].replace(',', '.'));
  
  const mYld = texto.match(/Yield Cota patrimonial[^\d]*([\d.,]+)\s*%/i);
  if (mYld) out.yieldPctCdi = parseFloat(mYld[1].replace(',', '.'));
  
  const mQtd = texto.match(/Quantidade total de cotas\s*([\d.,]+)/i);
  if (mQtd) out.qtdCotas = parseFloat(mQtd[1].replace(/\./g, '').replace(',', '.'));
  
  const mCaixa = texto.match(/Posi[çc][ãa]o em Caixa\s*([\d.,]+)\s*%/i);
  if (mCaixa) out.caixaPct = parseFloat(mCaixa[1].replace(',', '.'));
  
  return out;
}

    if (s2DataVenda <= s2DataCompra) return { erro: 'Data de venda deve ser posterior a de compra.' };

    const custo = pc * (1 + cc / 100);
    const liquido = pv * (1 - cv / 100);
    const rentNominal = liquido / custo - 1;

    const dus = listarDU(s2DataCompra, s2DataVenda, feriadosSet);
    const du = Math.max(dus.length - 1, 1);

    else aliq = 0.15;
    const grossUp = rentNominal / (1 - aliq);
    const pctCdiGross = cdiAcum > 0 ? (grossUp / cdiAcum) * 100 : null;

      custo, liquido, rentNominal, rentAa, du, diasCorr,
      cdiAcum, cdiCount, pctCdi, aliq, grossUp, pctCdiGross,

                    style={{ width: '100%', padding: '4px 6px', fontSize: 11, border: '1px solid #D1D5DB', borderRadius: 4, marginBottom: 6 }} />
                  <label style={{ fontSize: 10, color: '#6B7280', display: 'block' }}>Cota patrim. (R$)</label>
                  <input type="number" step="0.01"
                    defaultValue={ultObj ? ultObj.valor : baseFundo.cota_patrimonial_ref}
                    onBlur={e => {
                      const novoValor = Number(e.target.value);
                      const dataRef = ultIso || baseFundo.data_ref;
                      if (novoValor > 0) saveCotaPatrimOverride(t, dataRef, novoValor);
                    }}
                    style={{ width: '100%', padding: '4px 6px', fontSize: 11, border: '1px solid #D1D5DB', borderRadius: 4 }} />
                  {ultObj && (
                    <div style={{ marginTop: 4, fontSize: 9, color: '#9CA3AF' }}>
                      atualizado: {new Date(ultObj.atualizadoEm).toLocaleDateString('pt-BR')}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        <div>
          <h4 style={{ fontSize: 13, fontWeight: 600, margin: '0 0 6px', color: '#111827' }}>4. CDI (avançado)</h4>
          <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, color: '#374151', marginBottom: 8 }}>
            <input type="checkbox" checked={usarManual} onChange={e => setUsarManual(e.target.checked)} />
            Forçar CDI a.a. manual (ignorar série BCB)
          </label>
          {usarManual && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, maxWidth: 400 }}>
              <input type="range" min="8" max="20" step="0.05" value={cdiManual}
                onChange={e => setCdiManual(Number(e.target.value))} style={{ flex: 1 }} />
              <span style={{ fontSize: 13, fontWeight: 600, minWidth: 60 }}>{fmtPct(cdiManual, 2)}</span>
            </div>
          )}
          <div style={{ fontSize: 10, color: '#9CA3AF', marginTop: 8, lineHeight: 1.6 }}>
            Calendário B3: {DATA.feriados.length} feriados bancários (2025-2029).
            CDI: {cdiStatus === 'success' ? `${Object.keys(cdiSerie).length} cotações diárias da série 12 do BCB` : 'modo manual ativo'}.
          </div>
        </div>
      </section>
      )}
      <section style={{ background: '#fff', border: '1px solid #E5E7EB', borderRadius: 12, padding: '20px 22px', marginBottom: 20 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 16 }}>
          <Calculator size={18} style={{ color: '#374151' }} />
          <h2 style={{ fontSize: 17, fontWeight: 600, margin: 0 }}>Simulador de Trade (compra e venda)</h2>
        </div>
        <p style={{ fontSize: 12, color: '#6B7280', marginTop: -8, marginBottom: 16 }}>
          Informe compra e venda para calcular a rentabilidade no per&iacute;odo: nominal, anualizada, em % do CDI realizado e com gross-up (al&iacute;quota regressiva).
        </p>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: 12, marginBottom: 16 }}>
          <div>
            <label style={{ fontSize: 11, color: '#6B7280', display: 'block', marginBottom: 4 }}>ATIVO</label>
            <select value={s2Ticker} onChange={e => setS2Ticker(e.target.value)} style={{ width: '100%', padding: '8px 10px', border: '1px solid #D1D5DB', borderRadius: 8, fontSize: 14 }}>
              {['ISET11','ISEN11','ISTT11','ISNT11'].map(t => e('option', { key: t, value: t }, t))}
            </select>
          </div>
          <div>
            <label style={{ fontSize: 11, color: '#6B7280', display: 'block', marginBottom: 4 }}>DATA COMPRA</label>
            <input type="date" value={s2DataCompra} onChange={e => setS2DataCompra(e.target.value)} style={{ width: '100%', padding: '8px 10px', border: '1px solid #D1D5DB', borderRadius: 8, fontSize: 14 }} />
          </div>
          <div>
            <label style={{ fontSize: 11, color: '#6B7280', display: 'block', marginBottom: 4 }}>PRE&Ccedil;O COMPRA (R$)</label>
            <input type="number" step="0.01" value={s2PrecoCompra} onChange={e => setS2PrecoCompra(e.target.value)} style={{ width: '100%', padding: '8px 10px', border: '1px solid #D1D5DB', borderRadius: 8, fontSize: 14 }} />
          </div>
          <div>
            <label style={{ fontSize: 11, color: '#6B7280', display: 'block', marginBottom: 4 }}>CORRETAGEM COMPRA (%)</label>
            <input type="number" step="0.01" value={s2CorrCompra} onChange={e => setS2CorrCompra(e.target.value)} style={{ width: '100%', padding: '8px 10px', border: '1px solid #D1D5DB', borderRadius: 8, fontSize: 14 }} />
          </div>
          <div>
            <label style={{ fontSize: 11, color: '#6B7280', display: 'block', marginBottom: 4 }}>DATA VENDA</label>
            <input type="date" value={s2DataVenda} onChange={e => setS2DataVenda(e.target.value)} style={{ width: '100%', padding: '8px 10px', border: '1px solid #D1D5DB', borderRadius: 8, fontSize: 14 }} />
          </div>
          <div>
            <label style={{ fontSize: 11, color: '#6B7280', display: 'block', marginBottom: 4 }}>PRE&Ccedil;O VENDA (R$)</label>
            <input type="number" step="0.01" value={s2PrecoVenda} onChange={e => setS2PrecoVenda(e.target.value)} style={{ width: '100%', padding: '8px 10px', border: '1px solid #D1D5DB', borderRadius: 8, fontSize: 14 }} />
          </div>
          <div>
            <label style={{ fontSize: 11, color: '#6B7280', display: 'block', marginBottom: 4 }}>CORRETAGEM VENDA (%)</label>
            <input type="number" step="0.01" value={s2CorrVenda} onChange={e => setS2CorrVenda(e.target.value)} style={{ width: '100%', padding: '8px 10px', border: '1px solid #D1D5DB', borderRadius: 8, fontSize: 14 }} />
          </div>
        </div>
        {simTrade && simTrade.erro && (
          <div style={{ color: '#DC2626', fontSize: 13 }}>{simTrade.erro}</div>
        )}
        {simTrade && !simTrade.erro && (
          <div>
            <div style={{ fontSize: 12, color: '#6B7280', marginBottom: 12 }}>
              Custo efetivo de compra: <strong>{fmtMoney(simTrade.custo)}</strong> &middot; L&iacute;quido de venda: <strong>{fmtMoney(simTrade.liquido)}</strong> &middot; {simTrade.du} DU &middot; {simTrade.diasCorr} dias corridos
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap: 12 }}>
              <div style={{ border: '1px solid #E5E7EB', borderRadius: 8, padding: '12px 14px' }}>
                <div style={{ fontSize: 11, color: '#6B7280' }}>RENT. NOMINAL</div>
                <div style={{ fontSize: 22, fontWeight: 700, color: simTrade.rentNominal >= 0 ? '#059669' : '#DC2626' }}>{fmtPct(simTrade.rentNominal * 100, 2)}</div>
                <div style={{ fontSize: 11, color: '#9CA3AF' }}>no per&iacute;odo</div>
              </div>
              <div style={{ border: '1px solid #E5E7EB', borderRadius: 8, padding: '12px 14px' }}>
                <div style={{ fontSize: 11, color: '#6B7280' }}>RENT. ANUALIZADA</div>
                <div style={{ fontSize: 22, fontWeight: 700, color: '#111827' }}>{fmtPct(simTrade.rentAa * 100, 2)}</div>
                <div style={{ fontSize: 11, color: '#9CA3AF' }}>a.a. (252 DU)</div>
              </div>
              <div style={{ border: '1px solid #E5E7EB', borderRadius: 8, padding: '12px 14px' }}>
                <div style={{ fontSize: 11, color: '#6B7280' }}>% DO CDI</div>
                <div style={{ fontSize: 22, fontWeight: 700, color: '#374151' }}>{simTrade.pctCdi != null ? fmtPct(simTrade.pctCdi, 1) : 'n/d'}</div>
                <div style={{ fontSize: 11, color: '#9CA3AF' }}>CDI realizado no per&iacute;odo</div>
              </div>
              <div style={{ border: '1px solid #E5E7EB', borderRadius: 8, padding: '12px 14px' }}>
                <div style={{ fontSize: 11, color: '#6B7280' }}>GROSS-UP (% CDI)</div>
                <div style={{ fontSize: 22, fontWeight: 700, color: '#374151' }}>{simTrade.pctCdiGross != null ? fmtPct(simTrade.pctCdiGross, 1) : 'n/d'}</div>
                <div style={{ fontSize: 11, color: '#9CA3AF' }}>equiv. tributado a {fmtPct(simTrade.aliq * 100, 1)}</div>
              </div>
            </div>
            <div style={{ fontSize: 10, color: '#9CA3AF', marginTop: 12, lineHeight: 1.6 }}>
              Custo = pre&ccedil;o&times;(1+corr%); l&iacute;quido = pre&ccedil;o&times;(1&minus;corr%). % do CDI compara a rentabilidade ao CDI realizado (BCB s&eacute;rie 12) acumulado nos dias &uacute;teis entre compra e venda. Gross-up usa al&iacute;quota regressiva (&le;180d 22,5%; &le;360d 20%; &le;720d 17,5%; &gt;720d 15%): equivalente_bruto = rent&divide;(1&minus;al&iacute;quota).
            </div>
          </div>
        )}
      </section>


      <footer style={{ fontSize: 10, color: '#9CA3AF', textAlign: 'center', paddingTop: 16, borderTop: '1px solid #E5E7EB', lineHeight: 1.6 }}>
        Material informativo Engage, sem caráter de recomendação de investimento. Dados de domínio público (Itaú Asset Management, B3, Banco Central do Brasil).<br/>
        Simulações são meramente indicativas e não representam promessa de rentabilidade. Fundos sujeitos a riscos de mercado e crédito.
      </footer>
    </div>
  );
}

function AppLoader() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    fetch('./data.json?v=' + Date.now(), { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(json => setData(json))
      .catch(e => setErr(e.message || String(e)));
  }, []);
  if (err) return e('div', { className: 'err-screen' },
    e('strong', null, 'Erro ao carregar dados'),
    e('div', { style: { color: '#6B7280' } }, err),
    e('div', { style: { color: '#9CA3AF', fontSize: 12, marginTop: 12 } }, 'Tente recarregar a página.')
  );
  if (!data) return e('div', { className: 'loading-screen' },
    e('div', { className: 'loading-spinner' }),
    e('div', null, 'Carregando dados Engage...')
  );
  return e(App, { data });
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(e(AppLoader));

</script>
</body>
</html>
